[project]
name = "workchat-agent"
version = "0.1.0"
description = "企业微信智能知识 Agent"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "grpcio>=1.70,<2",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "openai>=1.68,<3",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "protobuf>=6.31,<7",
  "pypdf>=5.4,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.70,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/agent/v1/*_pb2.py", "src/agent/v1/*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
